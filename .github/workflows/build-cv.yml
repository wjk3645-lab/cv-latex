name: Build LaTeX CV

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex

      - name: Commit build log for debugging
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan temp_debug
          git rm -rf . 2>/dev/null || true
          git add -f main.log main.aux main.out 2>/dev/null || true
          git commit --allow-empty -m "build log" || true
          git push -f origin temp_debug:debug || true

      - name: Create release branch with only PDF
        if: steps.compile.outcome == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan temp_release
          git rm -rf .
          git add main.pdf
          git commit -m "Update CV PDF"
          git push -f origin temp_release:release

      - name: Create GitHub Release
        if: steps.compile.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated CV PDF build." \
            "./main.pdf"
